<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body{
        margin: 0;
        padding: 0;
        background: pink;
        display: flex;
        justify-content: center;
      }
      .container{
        height: 100vh;
        width: calc(100vw - 20em);
        background: greenyellow;
        gap: 1em;
        display: flex;
        flex-direction: column;
      }
      header,
      footer{
        background: grey;
        height: 100px;
        flex-grow: 0;
      }
      main{
        background: grey;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>
      <main>Main</main>
      <footer>Footer</footer>
      </section>
    </div>
  </body>
</html>
