<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body{
        margin: 0;
        padding: 0;
      }
      .main {
        height: 100vh;
        background: #25384B;
        display: flex;
        flex-direction: row;
        gap: 3em;
        padding: 0 3em 0 3em;
      }
      .left-section {
        background: #A3CFCC;
        display: flex;
        flex-grow: 2;
      }
      .right-section {
        background: #c59476;
        display: flex;
        flex-grow: 1;
        flex-direction: column;
        box-sizing: border-box;
        width: 10em;
        gap: 1em;
        padding: 1em 1em 1em 1em;
      }
      .item {
        background: #86C2DE;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
