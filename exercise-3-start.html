            font-family: 'faustina';
            color: white;
            display: flex;
            flex-direction: column;

        #header{

            border: 0.25em solid #0077ea;

        #footer{

        .bigBox{

            height: 80vh;
            width: 80vw;
            display: flex;
            flex-wrap: wrap;

        }
        .sidebar{

            border: 0.25em solid #e02200;
            border-radius: 0.5rem;
            margin: 1em;

            height: 80vh;
            width: 20vw;
        }
        .bigContainer{
            display: flex;
            flex-direction: row;
